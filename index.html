<!DOCTYPE html>
<html>
<style>
body, html {
  height: 100%;
  margin: 0;
}

.bgimg {
  background-image: url('soon.jpg');
  height: 100%;
  background-position: center;
  background-size: cover;
  position: relative;
  color: white;
  font-family: "Courier New", Courier, monospace;
  font-size: 25px;
}

.topleft {
  position: absolute;
  top: 0;
  left: 16px;
}

.bottomcenter {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translate(-50%, 5%);
  text-align: center;
}

.middle {
  position: absolute;
  top: 45%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

hr {
  margin: auto;
  width: 40%;
}
</style>
<body>

<div class="bgimg">
  <div class="topleft">
    <p><img src="logo.png" alt="Grant Norman"></p>
  </div>
  <div class="middle">
    <h1>Grant Norman</h1>
    <hr>
    <p>Freelance Camerman</p>
    <p>Contact: Grant@grantnorman.co.uk</p>
  </div>
  <div class="bottomcenter">
    <p></p>
  </div>
</div>

</body>
</html>
